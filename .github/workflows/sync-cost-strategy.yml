name: Sync cost-strategy with upstream dev
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cost-strategy
          fetch-depth: 0
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
      - name: Merge upstream/dev into cost-strategy
        id: merge
        continue-on-error: true
        run: |
          git config user.name "opencode-agent[bot]"
          git config user.email "opencode-agent[bot]@users.noreply.github.com"
          git merge upstream/dev --no-edit
      - name: Notify on conflict
        if: steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge --abort || true
          echo "::notice::gh version: $(gh --version | head -1)"
          echo "::notice::resolved repo: $(gh repo view --json nameWithOwner --jq .nameWithOwner 2>&1)"
          title="[auto] cost-strategy 同步冲突，需要手动合并"
          printf 'upstream/dev 合并进 cost-strategy 出现冲突（%s UTC）。\n\n请在本仓库 clone 中执行：\n\n```\ngit remote add upstream https://github.com/anomalyco/opencode.git\ngit fetch upstream dev\ngit merge upstream/dev\n```\n' "$(date -u '+%Y-%m-%d %H:%M')" > body.md
          search_raw=$(gh issue list --state open --search "${title} in:title" --json number 2>&1) || true
          number=$(echo "$search_raw" | jq -r '.[0].number // empty' 2>/dev/null || echo "$search_raw")
          echo "::notice::search raw: ${search_raw:0:200} / number: [${number}]"
          if [ -n "$number" ] && gh issue comment "$number" --body-file body.md; then
            echo "::notice::Merge conflict detected; commented on issue #$number"
            exit 0
          fi
          if url=$(gh issue create --title "$title" --body-file body.md 2>gh.err); then
            echo "::notice::Merge conflict detected; created issue $url"
            exit 0
          fi
          echo "::warning::Merge conflict detected but notification failed: $(head -c 300 gh.err 2>/dev/null || true)"
      - name: Push
        if: steps.merge.outcome == 'success'
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin cost-strategy