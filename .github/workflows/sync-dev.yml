name: Sync dev with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
      - name: Merge upstream/dev into fork dev
        id: merge
        continue-on-error: true
        run: |
          git config user.name "opencode-agent[bot]"
          git config user.email "opencode-agent[bot]@users.noreply.github.com"
          git merge upstream/dev --no-edit
      - name: Notify on conflict
        if: steps.merge.outcome == 'failure'
        run: |
          echo "::error::Merge conflict detected while syncing dev with upstream. Resolve manually:"
          echo "  git fetch upstream dev"
          echo "  git merge upstream/dev"
          exit 1
      - name: Push
        if: steps.merge.outcome == 'success'
        run: |
          git push origin dev
